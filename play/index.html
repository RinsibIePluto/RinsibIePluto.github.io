<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyrune</title>
<meta name="description" content="A daily code-breaking word puzzle. A new cipher every day.">
<meta name="theme-color" content="#15110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cyrune">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  /* Layout: one phone-width column on an Enigma desk: today's cipher strip, a lampboard of cipher letters with key rotors, the guess grid, a key bank. */
  --bakelite:#15110f;
  --case:#221c18;
  --brass:#c09b60;
  --ivory:#efe5cf;
  --lamp:#ffd27a;
  --correct:#3f8f6f;
  --present:#c8932c;
  --absent:#3a3330;
  --dim:#9d917e;
  --line:#3b322b;
  --tile-bg:#1b1613;
  --f-display:"Saira Stencil One", Impact, "Arial Narrow", sans-serif;
  --f-mono:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-body:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tile:44px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% -10%,#2a211b 0%,rgba(21,17,15,0) 60%),var(--bakelite);color:var(--ivory);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.app{flex:1 1 auto;min-height:0;max-height:940px;width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;gap:7px;
  padding:5px 12px calc(8px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
/* website bar across the top (the same menu as cyrune.app); it also carries the status-bar inset in the app */
.sitebar{flex:none;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));border-bottom:1px solid rgba(192,155,96,.18);background:rgba(13,10,8,.5)}
.sb-in{max-width:1120px;margin:0 auto;height:36px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-home{display:flex;align-items:center;gap:9px;color:var(--dim);text-decoration:none;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em}
.sb-mark{display:none}
.sb-word{display:none}
.sb-links{display:flex;align-items:center;gap:2px}
.native .sb-home{display:none}            /* in the app the bar is just Ciphers · About · Play */
.native .sb-in{justify-content:flex-end}
.sb-links a,.sb-links b{font-size:12px;font-weight:700;letter-spacing:.05em;padding:5px 10px;border-radius:999px;text-decoration:none;color:var(--ivory)}
.sb-links b{background:var(--brass);color:#1a1410;margin-left:2px}
/* very short screens: give the board the room (the same links are in the menu); the status-bar inset stays */
@media (max-height:689px){.sb-in{display:none}.sitebar{border-bottom:0;background:none}}
@media (min-width:760px){
  .sb-in{height:60px;padding:0 20px}
  .sb-mark{display:block;width:32px;height:32px}
  .sb-word{display:inline;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.12em;color:var(--brass)}
  .sb-url{display:none}
  .sb-links a,.sb-links b{font-size:15px;font-weight:600;letter-spacing:0;padding:8px 13px}
  .sb-links a:hover{color:var(--lamp)}
}

/* Brand mark (one SVG sprite, reused by the header, the intro and the app icons) */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
.brand>div{min-width:0}
.logo-mark{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

/* Intro / loading screen */
.intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 38%,#2c221a 0%,#16110e 52%,#0d0a08 100%);transition:opacity .45s ease,visibility .45s}
.intro.gone{opacity:0;visibility:hidden}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:20px;transform:translateY(-4%)}
.boot-mark{width:min(46vw,200px);height:auto;overflow:visible;filter:drop-shadow(0 22px 40px rgba(0,0,0,.65))}
.boot-mark .spin{transform-box:view-box;transform-origin:256px 256px;animation:spinIn 1.5s cubic-bezier(.16,.84,.24,1) both}
.boot-mark .rune{animation:runeOn 1.2s .45s ease-out both}
@keyframes spinIn{from{transform:rotate(-240deg) scale(.86);opacity:0}25%{opacity:1}to{transform:rotate(0) scale(1);opacity:1}}
@keyframes runeOn{0%{opacity:0}28%{opacity:1}38%{opacity:.2}52%{opacity:.9}60%{opacity:.45}74%,100%{opacity:1}}
.boot-word{display:flex;font-family:var(--f-display);font-size:clamp(32px,11vw,46px);line-height:1;color:var(--brass);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.boot-word span{display:inline-block;width:.86em;text-align:center}
.boot-word span.scr{color:#6d5838}
.boot-word span.lock{color:var(--brass);animation:lockIn .35s ease-out}
@keyframes lockIn{0%{color:var(--lamp);text-shadow:0 0 14px rgba(255,190,90,.9)}100%{color:var(--brass)}}
.boot-sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s;text-align:center;line-height:1.7}
.boot-sub b{color:var(--lamp);font-weight:700}
.boot-sub.on{opacity:1;transform:none}
.boot-hint{position:absolute;bottom:calc(28px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#5f5345}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 7px;border-bottom:1px solid rgba(192,155,96,.22)}
.logo{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1;letter-spacing:.05em;color:var(--brass);white-space:nowrap}
.edition{display:flex;align-items:center;gap:6px;margin-top:3px;font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edition button{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:#110d0b}
.mode button{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:999px;color:var(--dim)}
.mode button[aria-pressed="true"]{background:var(--brass);color:#1a1410}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--brass);font-family:var(--f-mono);font-weight:700;font-size:13px}
.icon-btn svg{width:15px;height:15px}

/* Today strip */
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.sname{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.sname .day{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sname b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--ivory)}
.stars{font-size:11px;letter-spacing:1px;color:var(--lamp)}
.stars i{font-style:normal;color:#4d4136}
.howbtn{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--brass);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;min-height:34px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1a1410}

/* Intercept card */
.intercept{background:var(--case);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.35)}
.ic-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.ic-head .hint{color:var(--dim);text-align:right}
.ic-head .hint.keying{color:var(--lamp)}
.ic-head .hint{display:flex;align-items:center;gap:8px}
.hintbtn{height:20px;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--lamp);font-family:var(--f-mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hintbtn:disabled{opacity:.35}
.hintbtn.adh{border-color:var(--lamp);background:#2d241c}
body.ad-on .modal{padding-bottom:calc(16px + var(--ad-h,60px) + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.ictime{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ivory);letter-spacing:.04em}
.window.hintw{box-shadow:inset 0 -4px 0 var(--lamp)}
.lamps{display:flex;justify-content:center;gap:10px;margin-top:6px}
.lamp-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.lamp{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#33291f 0%,#130f0c 72%);border:2px solid #5b4b38;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 2px #120e0b;font-family:var(--f-mono);font-weight:700;font-size:16px;color:var(--lamp);text-shadow:0 0 6px rgba(255,190,90,.85),0 0 16px rgba(255,160,50,.45)}
.lsub{font-family:var(--f-mono);font-weight:700;font-size:11px;line-height:12px;height:12px;color:var(--brass);margin:-1px 0}
.mcol{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%}
.tape{max-width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(5px*var(--s,1));min-height:36px;padding:7px 14px;border-radius:999px;background:radial-gradient(120% 140% at 50% 30%,#2e251d 0%,#120e0b 75%);border:2px solid #5b4b38;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 2px #120e0b;font-family:var(--f-mono);font-weight:700;font-size:19px;line-height:1;letter-spacing:1px;color:var(--lamp);text-shadow:0 0 6px rgba(255,190,90,.85),0 0 14px rgba(255,160,50,.4)}
.sym{display:inline-block;height:calc(8px*var(--s,1));min-height:6px;border-radius:99px;background:var(--lamp);box-shadow:0 0 6px rgba(255,190,90,.85),0 0 14px rgba(255,160,50,.4)}
.sym.dot{width:calc(8px*var(--s,1));min-width:6px}
.sym.dash{width:calc(18px*var(--s,1))}
.sym.m-ok{background:#86d3b0;box-shadow:0 0 6px rgba(80,200,150,.6)}
.sym.m-bad{background:#ef8d74;box-shadow:none;opacity:.85}
.tape .ml{display:inline-flex;align-items:center;gap:calc(5px*var(--s,1))}
.tape .mgap{display:inline-block;width:1px;height:16px;background:rgba(192,155,96,.55);margin:0 calc(8px*var(--s,1))}
.tape.boot{animation:lampOn .9s ease-out both}
.wrow{display:flex;justify-content:center;gap:10px}
.kbox{width:32px;height:20px;border-radius:4px;background:#120e0b;border:1px solid #7a6446;color:var(--brass);font-family:var(--f-mono);font-weight:700;font-size:11px;display:grid;place-items:center}
.kbox.sel{outline:2px solid var(--lamp);outline-offset:1px}
.kwin{height:32px;min-width:118px;max-width:150px;padding:0 10px;border-radius:5px;background:var(--ivory);color:#1b1511;font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.12em;box-shadow:inset 0 2px 3px rgba(0,0,0,.35);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kwin.empty{color:#8a7d66;font-size:10px;letter-spacing:.04em;font-weight:600}
.kwin.sel{outline:2px solid var(--lamp);outline-offset:1px}
.caret{display:inline-block;width:2px;height:14px;background:#1b1511;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.window.pad{opacity:.65}
.lamp.used{opacity:.28;text-shadow:none}
.lamp.num{font-size:14px;letter-spacing:.02em}
.lamp.pair{height:52px;border-radius:18px;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;font-size:14px;line-height:1}
.lamp.pig svg,.pg svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,180,80,.75))}
.lamp.pig svg circle,.pg svg circle{fill:currentColor;stroke:none}
.pg{color:var(--lamp);display:grid;place-items:center}
.mchart.pigs div{justify-content:space-between}
.pgrow{display:inline-flex;gap:6px;vertical-align:middle}
.pgrow .pg svg{width:18px;height:18px}
.rotor.wide .rwin{width:58px;font-size:12px}
.lamp.boot{animation:lampOn .9s ease-out both;animation-delay:calc(var(--i)*90ms)}
@keyframes lampOn{0%{color:#3d3226;text-shadow:none}35%{color:var(--lamp);text-shadow:0 0 6px rgba(255,190,90,.85),0 0 16px rgba(255,160,50,.45)}45%{color:#6d5838;text-shadow:none}60%,100%{color:var(--lamp);text-shadow:0 0 6px rgba(255,190,90,.85),0 0 16px rgba(255,160,50,.45)}}
.window{width:32px;height:24px;border-radius:4px;background:var(--ivory);color:#1b1511;font-family:var(--f-mono);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.window.empty{color:#b3a68d}
.window.sel{outline:2px solid var(--lamp);outline-offset:1px;box-shadow:0 0 12px rgba(255,210,122,.5)}
.window.ok{background:#cfe5d9;color:#123326}
.window.fail{background:#e9cfc4;color:#4b1d14}
.window.pin{box-shadow:inset 0 -4px 0 var(--brass)}
.window.okpin{background:#cfe5d9;color:#123326;box-shadow:inset 0 -4px 0 var(--correct)}
.window.clash{background:#e9cfc4;color:#7a2a1b;box-shadow:inset 0 -4px 0 #c4553f}
.decoder{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(192,155,96,.25);min-height:44px}
.dlabel{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);line-height:1.25}
.dlabel.op{font-family:var(--f-mono);font-size:14px;color:var(--brass);letter-spacing:0}
.rotor{display:inline-flex;align-items:center;background:#120e0b;border:1px solid var(--line);border-radius:8px;padding:2px}
.step{width:22px;height:32px;color:var(--brass);font-size:17px;line-height:1;border-radius:5px}
.step:active{background:#2b231d}
.rwin{width:28px;height:32px;border-radius:4px;background:var(--ivory);color:#1b1511;font-family:var(--f-mono);font-weight:700;font-size:14px;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.rwin.sel{outline:2px solid var(--lamp);outline-offset:1px}
.readout{font-family:var(--f-mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.readout.warn{color:#e08a74}
.readout.wrap{white-space:normal;line-height:1.45}
.spacer{flex:1}
.use{flex:none;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--brass);color:var(--brass);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.use:disabled{opacity:.35;cursor:default}
.use.ready{background:var(--brass);color:#1a1410}
.ghost{height:32px;padding:0 9px;border-radius:999px;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ghost.line{border:1px solid var(--line);color:var(--brass)}
.enigma{display:flex;flex-direction:column;gap:7px;width:100%}
.erow{display:flex;align-items:center;gap:6px;min-height:34px}
.bombe{flex:none;height:32px;padding:0 11px;border-radius:999px;background:#120e0b;border:1px solid var(--lamp);color:var(--lamp);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bombe:disabled{opacity:.35;cursor:default}
.stopper{display:inline-flex;align-items:center;gap:2px}
.debrief{display:flex;align-items:center;gap:10px;width:100%}
.debrief .txt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.debrief b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.05em}
.debrief.won b{color:#7fcaa9}
.debrief.lost b{color:#e08a74}
.debrief span{font-family:var(--f-mono);font-size:9.5px;color:var(--dim);line-height:1.4}
.next{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--brass);color:#1a1410;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* Board */
.board{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;gap:5px}
.row{display:grid;grid-template-columns:repeat(5,var(--tile));gap:5px}
.tile{width:var(--tile);height:var(--tile);border:2px solid var(--line);background:var(--tile-bg);border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:calc(var(--tile)*.4);color:var(--ivory);user-select:none}
.tile.filled{border-color:#7a6446;animation:pop .1s ease-out}
.tile.correct{--fbg:var(--correct)}
.tile.present{--fbg:var(--present)}
.tile.absent{--fbg:var(--absent)}
.tile.correct,.tile.present,.tile.absent{background:var(--fbg);border-color:var(--fbg);color:#fff}
.tile.present{color:#1d1508}
.tile.flip{animation:flip .52s ease both;animation-delay:calc(var(--i)*220ms)}
@keyframes flip{0%{transform:rotateX(0);background:var(--tile-bg);border-color:#7a6446;color:var(--ivory)}49.9%{transform:rotateX(90deg);background:var(--tile-bg);border-color:#7a6446;color:var(--ivory)}50%{transform:rotateX(90deg);background:var(--fbg);border-color:var(--fbg)}100%{transform:rotateX(0);background:var(--fbg);border-color:var(--fbg)}}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.row.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tile.bounce{animation:bounce .5s ease;animation-delay:calc(var(--i)*80ms)}
@keyframes bounce{40%{transform:translateY(-12px)}70%{transform:translateY(3px)}}

/* Key bank */
.kb{display:flex;flex-direction:column;gap:5px;border-radius:10px;transition:box-shadow .2s}
.kb.keying{box-shadow:0 0 0 1px rgba(255,210,122,.45),0 0 18px rgba(255,210,122,.12)}
.kb-row{display:flex;gap:5px;justify-content:center}
.kb-half{flex:.5}
.key{flex:1;max-width:46px;height:44px;border-radius:8px;background:linear-gradient(#3b332c,#29231e);border:1px solid #4d4238;border-bottom-width:3px;color:var(--ivory);font-family:var(--f-mono);font-weight:600;font-size:13px;display:grid;place-items:center}
.key:active{transform:translateY(1px);border-bottom-width:2px}
.key.wide{flex:1.55;max-width:70px;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.key.correct{background:var(--correct);border-color:#2c6b52}
.key.present{background:var(--present);border-color:#93681c;color:#1d1508}
.key.absent{background:#1d1816;border-color:#2a2420;color:#6b6157}

/* Toast */
.toasts{position:fixed;top:calc(130px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ivory);color:#1b1511;font-weight:700;font-size:13px;padding:9px 14px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:toastIn .15s ease-out;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(-4px)}}

/* Sheets */
.modal{position:fixed;inset:0;background:rgba(8,6,5,.74);display:flex;align-items:center;justify-content:center;z-index:40;
  padding:calc(16px + var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 16px calc(16px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.modal[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:460px;max-height:calc(100% / var(--ui,1));transform:scale(var(--ui,1));overflow:auto;background:var(--case);border:1px solid #4d4033;border-radius:14px;padding:20px 18px 18px;box-shadow:0 20px 50px rgba(0,0,0,.55);overscroll-behavior:contain}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.05em;color:var(--brass);text-wrap:balance;margin-bottom:10px;padding-right:36px}
.sheet h3{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.sheet p,.sheet li{font-size:14px;line-height:1.5;color:#e2d8c2}
.sheet p+p{margin-top:8px}
.sheet b{color:var(--ivory)}
.close{position:sticky;top:0;float:right;margin:-8px -6px 0 0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--case);color:var(--brass);font-size:18px;line-height:1;z-index:2}
.mini{display:flex;gap:4px;margin:8px 0}
.mini .tile{--tile:30px;font-size:12px}
.legend{display:grid;gap:6px;margin-top:4px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;color:#e2d8c2}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.week{list-style:none;display:grid;gap:4px}
.week li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:#1a1512;border:1px solid var(--line);font-size:13px}
.week li.today{border-color:var(--brass);background:#2a221c}
.week .d{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.week a{color:var(--ivory);text-decoration:none;font-weight:700}
.week .tag{font-family:var(--f-mono);font-size:9px;color:var(--lamp);letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.gcard{margin-top:14px;padding:14px;border-radius:10px;background:#1a1512;border:1px solid var(--line);scroll-margin-top:8px}
.gcard.focus{border-color:var(--brass)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.ghead h4{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--ivory)}
.ghead span{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gcard .lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:10px 0 3px}
.gex{font-family:var(--f-mono);font-size:12px;line-height:1.6;background:#120e0b;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ivory);overflow-x:auto;white-space:nowrap}
.try{display:flex;align-items:center;gap:8px;margin-top:6px}
.try input{width:96px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--ivory);color:#1b1511;font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:0 8px}
.try .arrow{color:var(--dim)}
.try output{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.12em;color:var(--lamp);text-shadow:0 0 8px rgba(255,190,90,.45)}
.mchart{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.mchart div{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 7px;border-radius:5px;background:#120e0b;border:1px solid var(--line);font-family:var(--f-mono);font-size:12px}
.mchart b{color:var(--ivory)}
.mchart span{color:var(--lamp);letter-spacing:1px}
.results{list-style:none;display:grid;gap:6px}
.results li{display:flex;align-items:center;gap:10px;background:#1a1512;border:1px solid var(--line);border-radius:8px;padding:10px}
.results .nm{flex:1;font-size:13px;font-weight:700}
.chip{font-family:var(--f-mono);font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;letter-spacing:.05em}
.chip.won{background:var(--correct);color:#fff}
.chip.lost{background:#a5493a;color:#fff}
.chip.playing{border:1px solid var(--line);color:var(--dim)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:999px;background:var(--brass);color:#1a1410;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.alt{background:none;border:1px solid var(--brass);color:var(--brass)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#1a1512;border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.dist{display:grid;gap:4px}
.dist-row{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px}
.bar{height:18px;min-width:22px;background:#3a312a;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.bar.hi{background:var(--correct)}
.rline{margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--ivory)}
.vs{margin-top:8px;font-size:13px;color:#e2d8c2}
.statgrid.two{grid-template-columns:1fr 1fr;margin-top:6px}
.tblwrap{overflow-x:auto}
.bytype{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.bytype th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:4px 6px;font-weight:700}
.bytype td{padding:6px;text-align:right;border-top:1px solid #2e2620;font-family:var(--f-mono)}
.bytype th:first-child,.bytype td:first-child{text-align:left;font-family:var(--f-body);font-weight:700}
.sheet p.countdown,.sheet p.rline{font-size:11.5px}
.countdown{margin-top:14px;font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.countdown b{color:var(--ivory);font-variant-numeric:tabular-nums}
.fallback{width:100%;margin-top:10px;height:130px;background:#120e0b;color:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-mono);font-size:11px}
.wkbar{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--brass);background:linear-gradient(90deg,#2d241c,#1c1612);font-size:11.5px;color:var(--ivory);margin-top:2px}
.wkbar b{color:var(--lamp);font-weight:700}
.wkbar span:last-child{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--brass);letter-spacing:.06em}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav b{font-size:15px}
.calnav .icon-btn:disabled{opacity:.3}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid .dow{text-align:center;font-family:var(--f-mono);font-size:9px;color:var(--dim);padding-bottom:2px}
.cday{position:relative;aspect-ratio:1;border-radius:8px;background:#1a1512;border:1px solid var(--line);font-family:var(--f-mono);font-size:12px;font-weight:700;display:grid;place-items:center}
.cday:disabled{opacity:.25}
.cday i{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.cday.won{background:#1d2a23;border-color:var(--correct)}.cday.won i{background:var(--correct)}
.cday.lost{border-color:#a5493a}.cday.lost i{background:#a5493a}
.cday.prog{border:2px solid var(--brass)}
.cday.today{outline:2px solid var(--lamp);outline-offset:1px}
.cday.cur{background:#2d241c}
.legend.cal{grid-template-columns:repeat(3,auto);display:grid;justify-content:start;gap:12px;margin-top:12px}
.coach{position:fixed;inset:0;z-index:90}
/* Android app: the website's guides and About page, bundled in the app and shown full screen (works offline) */
.reader{position:fixed;inset:0;z-index:95;background:#15110f;padding:var(--safe-area-inset-top,env(safe-area-inset-top,0px)) 0 var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
.reader[hidden]{display:none}
.reader iframe{display:block;width:100%;height:100%;border:0;background:#15110f}
.coach-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,6,5,.78);outline:2px solid var(--lamp);transition:all .25s ease;pointer-events:none}
.coach-card{position:fixed;left:16px;right:16px;max-width:440px;margin:0 auto;background:var(--case);border:1px solid var(--brass);border-radius:12px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.coach-card p{font-size:14px;line-height:1.5;color:#e2d8c2}
.coach-card b{color:var(--ivory)}
.coach-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.coach-foot span{flex:1;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.coach-foot .btn{height:34px}
.cardimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.install-box{padding:12px;border-radius:10px;border:1px dashed var(--brass);background:#1d1814}
.install-box a{color:var(--lamp)}

/* Menu and settings */
.mnav{display:grid;gap:6px}
.mnav button,.mnav a{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 12px;border-radius:9px;background:#1a1512;border:1px solid var(--line);font-size:14px;font-weight:700;text-align:left;color:inherit;text-decoration:none}
.mnav button span,.mnav a span{white-space:nowrap;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.06em}
.mnav button.gold{border-color:var(--brass)}
.ver{margin-top:16px;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--dim)}
.setting{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #2e2620}
.setting:last-child{border-bottom:0}
.setting .st{flex:1;min-width:0}
.setting .st b{display:block;font-size:14px}
.setting .st small{display:block;font-size:12px;line-height:1.4;color:var(--dim);margin-top:2px}
.switch{flex:none;width:46px;height:28px;border-radius:999px;background:#2e2722;border:1px solid #4a3f35;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8c7f6c;transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--brass);border-color:var(--brass)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#1a1410}
.setting input[type=time]{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--ivory);color:#1b1511;font-family:var(--f-mono);font-weight:700;padding:0 6px}
.codebox{display:flex;gap:8px;margin-top:6px}
.codebox input{flex:1;min-width:0;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--ivory);color:#1b1511;font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:0 10px}

/* Colour-blind (high contrast) palette */
body.cb{--correct:#f5793a;--present:#85c0f9}
body.cb .tile.present,body.cb .key.present{color:#0d1b2a}
body.cb .key.correct{border-color:#b8541f}
body.cb .key.present{border-color:#5c95c9}
body.cb .window.ok,body.cb .window.okpin{background:#fbd3bd;color:#5a2408}
body.cb .chip.won,body.cb .bar.hi{background:var(--correct)}

@media (max-width:360px){
  .logo{font-size:18px}
  .logo-mark{width:24px;height:24px}
  .edition{font-size:8px}
  .mode button{padding:6px 7px;font-size:9px}
  .lamps{gap:7px}
  .tape{padding:6px 10px}
  .step{width:18px}
  .rwin{width:26px}
  .mchart{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:340px){.logo-mark{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Each day's cipher is random but the same for everyone. The ciphers come out of a shuffled bag: every run of

const BAG_V1=["morse","shift","scramble","vig","affine","sub","enigma"];
const BAG_V2=["morse","shift","scramble","vig","affine","sub","enigma","beaufort","autokey","keyword","running","playfair","railfence","pigpen","polybius","bifid","adfgvx"];
const V2_START=2;

  const v1=n<V2_START,list=v1?BAG_V1:BAG_V2,salt=v1?0xB0A7:0xC1A5,N=list.length;

  if(bag[0]===prevLast){const t=bag[0];bag[0]=bag[1];bag[1]=t;}

const ROT=["EKMFLGDQVZNTOWYHXUSPAIBRCJ","AJDKSIRUXBLHWTMCQGZNPYFVOE","BDFHJLCPRTXVZNYEIWGAKMUSQO"].map(s=>[...s].map(idx));

function enigma(text,start){
  let l=start[0],m=start[1],r=start[2];let out="";
  for(let i=0;i<text.length;i++){
    if(m===NOTCH[1]){m=(m+1)%26;l=(l+1)%26;}else if(r===NOTCH[2]){m=(m+1)%26;}
    r=(r+1)%26;
    let c=text.charCodeAt(i)-65;
    c=(ROT[2][(c+r)%26]-r+26)%26;c=(ROT[1][(c+m)%26]-m+26)%26;c=(ROT[0][(c+l)%26]-l+26)%26;
    c=REF[c];
    c=(INV[0][(c+l)%26]-l+26)%26;c=(INV[1][(c+m)%26]-m+26)%26;c=(INV[2][(c+r)%26]-r+26)%26;

function runBombe(cipher,pins){
  const keys=Object.keys(pins).map(Number);const stops=[];let n=0;

  }

/* plain encoders, shared by the game and the guide */
const ENC={
  shift:(w,k)=>[...w].map(c=>A[(idx(c)+k)%26]).join(""),
  vig:(w,k)=>[...w].map((c,i)=>A[(idx(c)+k[i%k.length])%26]).join(""),
  affine:(w,a,b)=>[...w].map(c=>A[(a*idx(c)+b)%26]).join(""),
  scramble:(w,o)=>o.map(i=>w[i]).join(""),
  sub:(w,alpha)=>[...w].map(c=>alpha[idx(c)]).join(""),
  morse:w=>[...w].map(c=>MORSE[c]).join(""),
  enigma:(w,p)=>enigma(w,p),
  beaufort:(w,k)=>[...w].map((c,i)=>A[(k[i%k.length]-idx(c)+26)%26]).join(""),
  autokey:(w,p)=>{const ks=p.concat([...w].map(idx));return [...w].map((c,i)=>A[(idx(c)+ks[i])%26]).join("");},
  keyword:(w,kw)=>ENC.sub(w,kwAlpha(kw)),
  running:(w,k)=>[...w].map((c,i)=>A[(idx(c)+idx(k[i]))%26]).join(""),
  playfair:(w,kw)=>pfCrypt(pfSquare(kw),w,1),
  railfence:(w,r,o)=>railOrder(w.length,r,o).map(i=>w[i]).join(""),
  pigpen:(w,t)=>[...w].map(L=>pigLetter(pigT(pigCell(L),t))).join(""),
  polybius:(w,kw)=>{const sq=pfSquare(kw);return [...w.replace(/J/g,"I")].map(ch=>{const i=sq.indexOf(ch);return `${Math.floor(i/5)+1}${i%5+1}`;}).join("");},
  bifid:(w,kw)=>bfEncrypt(pfSquare(kw),w.replace(/J/g,"I")),
  adfgvx:(w,o)=>{const cols=adfgCols(adfgFrac(w));return o.map(j=>cols[j]).join("");}
};
/* keyword alphabet: the keyword's letters (repeats dropped), then the rest of the alphabet in order */
function kwAlpha(kw){let s="";for(const c of kw+A)if(!s.includes(c))s+=c;return s;}
/* Playfair: 5x5 square from a keyword, I and J share a cell; text is encrypted two letters at a time */
function pfSquare(kw){let s="";for(const c of (kw+A).replace(/J/g,"I"))if(!s.includes(c))s+=c;return s;}
function pfCrypt(sq,text,dir){
  text=text.replace(/J/g,"I");let out="";
  for(let i=0;i+1<text.length;i+=2){
    const a=sq.indexOf(text[i]),b=sq.indexOf(text[i+1]),ra=Math.floor(a/5),ca=a%5,rb=Math.floor(b/5),cb=b%5;
    if(ra===rb)out+=sq[ra*5+(ca+dir+5)%5]+sq[rb*5+(cb+dir+5)%5];
    else if(ca===cb)out+=sq[((ra+dir+5)%5)*5+ca]+sq[((rb+dir+5)%5)*5+cb];
    else out+=sq[ra*5+cb]+sq[rb*5+ca];
  }
  return out;
}
/* Rail fence: letters written on a zigzag over r rails (starting o steps into the zigzag), then read rail by rail */
function railOrder(n,r,o){const L=2*(r-1),rail=[];for(let i=0;i<n;i++){const t=(i+o)%L;rail.push(t<r?t:L-t);}
  const order=[];for(let k=0;k<r;k++)for(let i=0;i<n;i++)if(rail[i]===k)order.push(i);return order;}
/* Pigpen: two tic-tac-toe grids (the second dotted) and two X shapes; the key is how the grid is turned or flipped */
const PIG_X={S:0,T:3,U:1,V:2,W:0,X:3,Y:1,Z:2};             /* X cells: 0 top, 1 right, 2 bottom, 3 left */
function pigCell(L){const i=idx(L);if(i<18){const j=i%9;return{g:i<9?0:1,r:Math.floor(j/3),c:j%3};}return{g:i<22?2:3,x:PIG_X[L]};}
function pigLetter(cl){if(cl.g<2)return A[cl.g*9+cl.r*3+cl.c];return [...(cl.g===2?"STUV":"WXYZ")].find(ch=>PIG_X[ch]===cl.x);}
function pigT(cl,t){const k=t%4,m=t>=4,c=Object.assign({},cl);
  if(c.g<2){let r=c.r,cc=c.c;if(m)cc=2-cc;for(let i=0;i<k;i++){const nr=cc,nc=2-r;r=nr;cc=nc;}c.r=r;c.c=cc;}
  else{let x=c.x;if(m)x=[0,3,2,1][x];c.x=(x+k)%4;}return c;}
const PIG_TURNS=["0°","90°","180°","270°","⇄ 0°","⇄ 90°","⇄ 180°","⇄ 270°"];
function pigSVG(L){
  const cl=pigCell(L),dot=cl.g===1||cl.g===3;let d="",dotXY=[12,12];

/* Polybius / Bifid share the keyword square from Playfair (I and J in one cell) */
function pbDecode(sq,cipher){let out="";for(let i=0;i+1<cipher.length;i+=2)out+=sq[(+cipher[i]-1)*5+(+cipher[i+1]-1)]||"";return out;}
function bfEncrypt(sq,t){const rows=[],cols=[];for(const ch of t){const i=sq.indexOf(ch);rows.push(Math.floor(i/5));cols.push(i%5);}
  const s=rows.concat(cols);let out="";for(let i=0;i<s.length;i+=2)out+=sq[s[i]*5+s[i+1]];return out;}
function bfDecrypt(sq,t){const s=[];for(const ch of t){const i=sq.indexOf(ch);s.push(Math.floor(i/5),i%5);}const n=t.length;let out="";for(let i=0;i<n;i++)out+=sq[s[i]*5+s[n+i]];return out;}
function kwDecrypt(type,kw,cipher){const sq=pfSquare(kw);return type==="playfair"?pfCrypt(sq,cipher,-1):type==="polybius"?pbDecode(sq,cipher):bfDecrypt(sq,cipher);}
/* ADFGVX: each letter becomes two of A D F G V X (from a public 6x6 square); the 10 signals are written in two rows

const ADFG_SQ="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",ADFG="ADFGVX";
const adfgFrac=w=>[...w].map(ch=>{const i=ADFG_SQ.indexOf(ch);return ADFG[Math.floor(i/6)]+ADFG[i%6];}).join("");
function adfgCols(frac){return [0,1,2,3,4].map(j=>frac[j]+frac[5+j]);}
/* words Playfair can carry cleanly: no J, no doubled letter inside a pair, and room for an X pad */
const pfOK=w=>!w.includes("J")&&w[0]!==w[1]&&w[2]!==w[3]&&w[4]!=="X";
function pickKeyword(r,avoid){let k;do{k=ANS[Math.floor(r()*ANS.length)];}while(k===avoid||new Set(k).size<4||k.includes("J"));return k;}

function build(type,word,seed){
  const r=rng32(seed);let cipher=word,key={};
  if(type==="morse"){cipher=ENC.morse(word);}
  else if(type==="shift"){const k=1+Math.floor(r()*25);key={k};cipher=ENC.shift(word,k);}
  else if(type==="scramble"){
    const k=1+Math.floor(r()*25),sh=ENC.shift(word,k);
    let o,c,tries=0;
    do{o=shuffle([0,1,2,3,4],r);c=ENC.scramble(sh,o);tries++;}while((o.some((v,i)=>v===i)||c===sh)&&tries<300);

  }else if(type==="beaufort"){
    let k;do{k=[0,1,2].map(()=>Math.floor(r()*26));}while(k[0]===k[1]&&k[1]===k[2]);
    key={k};cipher=ENC.beaufort(word,k);
  }else if(type==="autokey"){
    const p=[1+Math.floor(r()*25),1+Math.floor(r()*25)];key={p};cipher=ENC.autokey(word,p);
  }else if(type==="keyword"){
    let kw;do{kw=pickKeyword(r,word);cipher=ENC.keyword(word,kw);}while(cipher===word);
    key={kw};
  }else if(type==="running"){
    const kw=pickKeyword(r,word);key={kw};cipher=ENC.running(word,kw);
  }else if(type==="playfair"){
    const kw=pickKeyword(r,word);key={kw};cipher=ENC.playfair(word+"X",kw);
  }else if(type==="railfence"){
    let rr,o,tries=0;do{rr=2+Math.floor(r()*3);o=Math.floor(r()*(2*rr-2));cipher=ENC.railfence(word,rr,o);tries++;}while(cipher===word&&tries<50);

  }else if(type==="adfgvx"){
    let o,tries=0;do{o=shuffle([0,1,2,3,4],r);tries++;}while(o.some((v,i)=>v===i)&&tries<100);key={order:o};cipher=ENC.adfgvx(word,o);
  }

}
function dailyPuzzle(n){
  const t=dailyType(n);let j=n-1;
  if(t==="playfair")while(!pfOK(ORDER[j%ORDER.length]))j++;
  if(t==="polybius"||t==="bifid")while(ORDER[j%ORDER.length].includes("J"))j++;

}
function practicePuzzle(type,seed){
  const r=rng32(seed);let w;
  if(type==="double"){w=ANS[Math.floor(r()*ANS.length)];return buildDouble(w,DOUBLE_INNER[Math.floor(r()*4)],(seed^0x9E3779B9)>>>0);}
  do{w=ANS[Math.floor(r()*ANS.length)];}while((type==="playfair"&&!pfOK(w))||((type==="polybius"||type==="bifid")&&w.includes("J")));

const token=(P,i)=>P.type==="polybius"||P.type==="adfgvx"?P.cipher.slice(2*i,2*i+2):P.cipher[i];
const lampCount=P=>P.type==="playfair"?6:P.type==="morse"?0:5;
function lampFace(P,p){
  if(P.type==="adfgvx")return `<span>${P.cipher[2*p]}</span><span>${P.cipher[2*p+1]}</span>`;

/* Run-on Morse: check the letters typed into the windows against the tape, from both ends inwards. */
function morseFit(P,notes){
  const s=P.cipher,n=s.length;let pre="",suf="",i=0,j=4;
  while(i<5&&notes[i]){pre+=MORSE[notes[i]];i++;}
  if(i===5)return pre===s?{ok:[0,n],bad:null,full:true,used:n}:{ok:null,bad:[0,Math.min(n,pre.length)],full:false,used:0};
  while(j>=0&&notes[j]){suf=MORSE[notes[j]]+suf;j--;}
  const r={ok:null,okEnd:null,bad:null,badEnd:null,full:false,used:0};
  if(pre){if(s.startsWith(pre)){r.ok=[0,pre.length];r.used+=pre.length;}else r.bad=[0,Math.min(n,pre.length)];}
  if(suf){if(s.endsWith(suf)&&pre.length+suf.length<=n){r.okEnd=[n-suf.length,n];r.used+=suf.length;}else r.badEnd=[Math.max(0,n-suf.length),n];}

function freshDec(t){
  switch(t){
    case"morse":return{notes:{}};
    case"shift":return{k:null};
    case"scramble":return{k:0,slots:[null,null,null,null,null]};
    case"vig":return{k:[null,null]};
    case"affine":return{ai:null,b:null};
    case"sub":return{map:{}};
    case"beaufort":return{k:[null,null,null]};
    case"autokey":return{k:[null,null]};
    case"keyword":return{kw:""};
    case"running":return{key:[null,null,null,null,null]};
    case"playfair":return{kw:"",crib:{},bombe:null};
    case"double":return{slots:[null,null,null,null,null],k:[null,null,null],ai:null,b:null};
    case"railfence":return{r:null,o:0};
    case"pigpen":return{t:null};
    case"polybius":case"bifid":return{kw:"",crib:{},bombe:null};
    case"adfgvx":return{slots:[null,null,null,null,null]};

function decode(P,d){
  const c=[...P.cipher].map(idx);
  switch(P.type){
    case"morse":return [0,1,2,3,4].map(i=>d.notes[i]||"");
    case"shift":return c.map(x=>d.k==null?"":A[(x-d.k+26)%26]);
    case"scramble":return d.slots.map(s=>s==null?"":A[(idx(P.cipher[s])-(d.k||0)+26)%26]);
    case"vig":return c.map((x,i)=>{const k=d.k[i%2];return k==null?"":A[(x-k+26)%26];});
    case"affine":{if(d.ai==null||d.b==null)return c.map(()=>"");const inv=AINV[AVALS[d.ai]];return c.map(x=>A[(inv*((x-d.b+26)%26))%26]);}
    case"sub":return [...P.cipher].map(ch=>d.map[ch]||"");
    case"beaufort":return c.map((x,i)=>{const k=d.k[i%3];return k==null?"":A[(k-x+26)%26];});
    case"autokey":{
      /* each primer letter starts a chain: letter i is unlocked by letter i-2 */
      const out=[null,null,null,null,null];
      for(let i=0;i<5;i++){const k=i<2?d.k[i]:out[i-2];out[i]=k==null?null:(c[i]-k+26)%26;}
      return out.map(v=>v==null?"":A[v]);}
    case"keyword":{if(!d.kw)return c.map(()=>"");const al=kwAlpha(d.kw);return [...P.cipher].map(ch=>A[al.indexOf(ch)]);}
    case"running":return c.map((x,i)=>d.key[i]==null?"":A[(x-d.key[i]+26)%26]);
    case"playfair":return d.kw?[...pfCrypt(pfSquare(d.kw),P.cipher,-1)]:c.map(()=>"");
    case"double":return innerDecode(P.inner,d.slots.map(s=>s==null?null:c[s]),d);
    case"railfence":{if(d.r==null)return ["","","","",""];const ord=railOrder(5,d.r,d.o||0),out=Array(5).fill("");ord.forEach((pi,j)=>{out[pi]=P.cipher[j];});return out;}

      for(let i=0;i<5;i++){const a=seq[2*i],b=seq[2*i+1];out.push(a&&b?ADFG_SQ[ADFG.indexOf(a)*6+ADFG.indexOf(b)]:"");}

function notesWithHints(g){const n=Object.assign({},g.dec.notes||{});(g.hints||[]).forEach(p=>{n[p]=P.word[p];});return n;}
/* hinted letters always win over the decoder's guess */
function withHints(g,arr){const a=arr.slice();(g.hints||[]).forEach(p=>{a[p]=P.word[p];});return a;}
/* Weekend challenge: a polyalphabetic cipher first, then the positions shuffled */
const DOUBLE_INNER=["vig","beaufort","affine","autokey"];
const ORDER_W=shuffle(ANS,rng32(0x3EE7E));
function buildDouble(word,inner,seed){
  const P1=build(inner,word,seed),r=rng32((seed^0x51ED)>>>0);let o,c,tries=0;
  do{o=shuffle([0,1,2,3,4],r);c=ENC.scramble(P1.cipher,o);tries++;}while((o.some((v,i)=>v===i)||c===P1.cipher)&&tries<300);

}
function weekendPuzzle(no){const seed=(no*15485863+0xFADE)>>>0,r=rng32(seed);return buildDouble(ORDER_W[(no-1)%ORDER_W.length],DOUBLE_INNER[Math.floor(r()*4)],seed);}
/* decode one position of a polyalphabetic cipher from its (already unshuffled) letters */
function innerDecode(inner,c,d){
  const out=[null,null,null,null,null];
  for(let i=0;i<5;i++){
    if(c[i]==null)continue;
    if(inner==="vig"){const k=d.k[i%2];if(k!=null)out[i]=(c[i]-k+26)%26;}
    else if(inner==="beaufort"){const k=d.k[i%3];if(k!=null)out[i]=(k-c[i]+26)%26;}
    else if(inner==="affine"){if(d.ai!=null&&d.b!=null)out[i]=(AINV[AVALS[d.ai]]*((c[i]-d.b+26)%26))%26;}
    else if(inner==="autokey"){const k=i<2?d.k[i]:out[i-2];if(k!=null)out[i]=(c[i]-k+26)%26;}

    if(keys.every(p=>d[p]===pins[p].replace("J","I"))){n++;if(stops.length<MAX_STOPS)stops.push(kw);}}

function score(guess,ans){

  for(let i=0;i<5;i++){if(guess[i]===ans[i])res[i]="correct";else cnt[ans[i]]=(cnt[ans[i]]||0)+1;}
  for(let i=0;i<5;i++){if(res[i]!=="correct"&&cnt[guess[i]]>0){res[i]="present";cnt[guess[i]]--;}}

function greensOf(G,P){const g={};G.guesses.forEach(w=>{for(let i=0;i<5;i++)if(w[i]===P.word[i])g[i]=w[i];});return g;}

function selPositions(){

    case"beaufort":return [0,1,2,3,4].filter(p=>p%3===sel.slot);
    case"autokey":return [0,1,2,3,4].filter(p=>p%2===sel.slot);

function keyText(){
  const k=P.key;
  switch(P.type){
    case"morse":return `The tape split as ${[...P.word].map(c=>`${c} ${MORSE[c]}`).join("  ")}`;
    case"shift":return `Key ${A[k.k]} · every letter shifted +${k.k}`;
    case"scramble":return `Shift ${A[k.k]} (+${k.k}), then order ${k.order.map(i=>i+1).join("-")} · lamp 1 showed letter ${k.order[0]+1} of the word, and so on`;
    case"vig":return `Key ${A[k.k[0]]}${A[k.k[1]]} · +${k.k[0]} on letters 1·3·5, +${k.k[1]} on 2·4`;
    case"affine":return `Key ×${k.a} +${k.b} · each letter x became ${k.a}x + ${k.b}, wrapped at 26`;
    case"sub":{const seen=new Set(),pairs=[];for(const c of P.word){if(!seen.has(c)){seen.add(c);pairs.push(`${c}→${A[k.perm[idx(c)]]}`);}}return `Swap table · ${pairs.join("  ")}`;}
    case"beaufort":return `Key ${k.k.map(x=>A[x]).join("")} · each letter became key minus letter; letters 1·4, 2·5 and 3 each had their own key letter`;
    case"autokey":return `Primer ${A[k.p[0]]}${A[k.p[1]]}, then the word keyed itself · key stream ${A[k.p[0]]}${A[k.p[1]]}${P.word.slice(0,3)}`;
    case"keyword":return `Keyword ${k.kw} · alphabet ${kwAlpha(k.kw)}`;
    case"running":return `Key word ${k.kw} · each letter shifted by the key letter in the same spot`;
    case"double":{const o=k.order.map(i=>i+1).join("-"),ik=P.inner==="affine"?`×${k.a} +${k.b}`:P.inner==="autokey"?`primer ${k.p.map(x=>A[x]).join("")}`:`key ${k.k.map(x=>A[x]).join("")}`;
      return `${P.label} · ${TYPES[P.inner].short} ${ik}, then order ${o}`;}
    case"railfence":return `${k.r} rails, starting at step ${k.o+1} of the zigzag · read off rail by rail`;
    case"pigpen":return `Grid turned ${PIG_TURNS[k.t]} · every symbol moved with it`;
    case"polybius":return `Keyword ${k.kw} · square ${pfSquare(k.kw).match(/...../g).join(" ")}`;
    case"bifid":return `Keyword ${k.kw} · rows ${[...P.word].map(c=>Math.floor(pfSquare(k.kw).indexOf(c)/5)+1).join("")}, columns ${[...P.word].map(c=>pfSquare(k.kw).indexOf(c)%5+1).join("")}, then re-paired`;

    case"playfair":return `Keyword ${k.kw} · pairs ${(P.word+"X").match(/../g).join(" ")} became ${P.cipher.match(/../g).join(" ")}`;

  }

const fmtTime=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;};
const fmtPts=n=>Number(n||0).toLocaleString("en-US");
setInterval(()=>{const el=document.getElementById("icTimer"),g=state&&G();if(el&&g)el.textContent=fmtTime(elapsed(g));},1000);
const MAX_HINTS=2;
function useHint(){
  const g=G();if(g.status!=="playing"||revealing)return;
  if((g.hints||[]).length>=MAX_HINTS+(g.extraHints||0)){if(adHintAvailable(g))rewardedHint();else toast("No hints left on this puzzle");return;}
  const known=knownOf(g,P),cand=[0,1,2,3,4].filter(p=>!known[p]);
  if(!cand.length){toast("You already know every letter");return;}
  const p=cand[Math.floor(Math.random()*cand.length)];
  g.hints=(g.hints||[]).concat(p);if(P.type==="enigma"||P.type==="playfair"||P.type==="polybius"||P.type==="bifid")g.dec.bombe=null;
  touchGame();sfx("hint");buzz("tap");toast(`Hint: letter ${p+1} is ${P.word[p]}`,2200);save();render();

/* score: difficulty × guesses × hints × speed × hard mode */
const STAR_MULT=[1,1.2,1.4,1.7,2],GUESS_MULT=[1,.85,.72,.6,.48,.36];
function computeScore(g,P){
  if(g.status!=="won")return 0;
  const t=(g.ms||0)/1000,speed=t<=60?1.3:t>=600?1:1.3-.3*(t-60)/540;
  return Math.round(1000*STAR_MULT[TYPES[P.type].stars-1]*GUESS_MULT[g.guesses.length-1]*Math.pow(.8,(g.hints||[]).length)*speed*(g.hard?1.5:1)/10)*10;
}
function recordFinish(g){
  if(g.counted)return;g.counted=true;
  const won=g.status==="won",sc=g.score||0;
  const b=stats.byType[P.type]||(stats.byType[P.type]={played:0,won:0,guesses:0,best:0});
  b.played++;if(won){b.won++;b.guesses+=g.guesses.length;b.best=Math.max(b.best,sc);}
  if(state.mode==="daily"){
    stats.played++;
    if(won){stats.won++;stats.dist[g.guesses.length-1]++;stats.streak=stats.lastWon===g.n-1?stats.streak+1:1;stats.lastWon=g.n;stats.best=Math.max(stats.best,stats.streak);
      stats.bestScore=Math.max(stats.bestScore,sc);stats.totalScore+=sc;maybeQueueReview();}
    else stats.streak=0;
  }else if(state.mode==="practice"){settings.practiceDone=(settings.practiceDone||0)+1;saveSettings();if(settings.practiceDone%ADS.everyPractice===0)adDue=true;
  }else if(state.mode==="weekend"){stats.weekend.played++;if(won){stats.weekend.won++;stats.weekend.best=Math.max(stats.weekend.best,sc);}}
}

/* sounds are synthesised on the fly: no audio files to ship */

function tone(freq,dur,type,vol,delay){const a=audio();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();

function click(vol){const a=audio();if(!a)return;const len=Math.floor(a.sampleRate*.025),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type="bandpass";f.frequency.value=2300;f.Q.value=.9;g.gain.value=vol;
  src.buffer=buf;src.connect(f).connect(g).connect(a.destination);src.start();}

  switch(kind){
    case"key":click(.25);break;
    case"rotor":tone(1900,.025,"square",.022);break;
    case"tile":tone(arg==="correct"?740:arg==="present"?560:300,.09,"triangle",.06);break;
    case"win":[523,659,784,1047].forEach((f,i)=>tone(f,.24,"triangle",.07,i*.09));break;
    case"lose":tone(220,.3,"sawtooth",.035);tone(165,.42,"sawtooth",.03,.18);break;
    case"error":tone(140,.12,"square",.03);break;
    case"hint":tone(1320,.12,"sine",.05);tone(1760,.18,"sine",.04,.07);break;
  }
}

function wtSteps(){

const TCODE={shift:"SHF",railfence:"RAIL",pigpen:"PIG",autokey:"AUTO",morse:"MRS",scramble:"SCR",vig:"VIG",beaufort:"BEAU",affine:"AFF",keyword:"KEY",sub:"SUB",polybius:"POLY",adfgvx:"ADFG",running:"RUN",playfair:"PLAY",bifid:"BIF",enigma:"ENIG",double:"DBL"};

function playCode(v){
  const m=String(v).trim().toUpperCase().replace(/\s+/g,"").match(/^([A-Z]{3,4})-([0-9A-Z]{1,7})(?:-(\d{1,6}))?$/);
  const type=m&&Object.keys(TCODE).find(k=>TCODE[k]===m[1]);
  if(!type){toast("That code doesn't look right: it should look like VIG-4K9Z2",2600);return false;}
  practiceType(type,parseInt(m[2],36)>>>0,m[3]?{score:+m[3]}:null);
  toast(m[3]?`Friend's puzzle loaded: beat ${fmtPts(+m[3])}`:"Friend's puzzle loaded",2200);return true;
}

/* ---------- past puzzles ---------- */
let calMonth=null;
const dayN=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1;
function gameFor(n){if(n===todayN())return state.daily;return state.arch&&state.arch[n];}
function openCalendar(){const d=nDate(state.mode==="archive"?state.archiveN:todayN());calMonth={y:d.getFullYear(),m:d.getMonth()};renderCal();showModal("calModal");}
function renderCal(){
  const {y,m}=calMonth,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,today=todayN();
  const canPrev=dayN(first)>1,canNext=dayN(new Date(y,m+1,1))<=today;
  let cells="";for(let i=0;i<lead;i++)cells+=`<span></span>`;
  let done=0,won=0;
  for(let d=1;d<=days;d++){
    const n=dayN(new Date(y,m,d)),g=gameFor(n),off=n<1||n>today;
    const st=off?"":g&&g.status==="won"?"won":g&&g.status==="lost"?"lost":g&&g.guesses&&g.guesses.length?"prog":"";
    if(st==="won"||st==="lost")done++;if(st==="won")won++;
    cells+=`<button class="cday ${st}${n===today?" today":""}${state.mode==="archive"&&n===state.archiveN?" cur":""}" data-day="${n}" ${off?"disabled":""} aria-label="${d} ${first.toLocaleDateString("en-GB",{month:"long"})}${st?", "+st:""}">${d}<i></i></button>`;
  }
  const label=first.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  $("#calBody").innerHTML=`<div class="calnav"><button class="icon-btn" data-calnav="-1" ${canPrev?"":"disabled"} aria-label="Previous month">‹</button><b>${label}</b><button class="icon-btn" data-calnav="1" ${canNext?"":"disabled"} aria-label="Next month">›</button></div>
    <div class="calgrid">${["M","T","W","T","F","S","S"].map(x=>`<span class="dow">${x}</span>`).join("")}${cells}</div>
    <div class="legend cal"><div><span class="sw" style="background:var(--correct)"></span>Cracked</div><div><span class="sw" style="background:#a5493a"></span>Missed</div><div><span class="sw" style="border:2px solid var(--brass)"></span>Started</div></div>
    <p class="countdown">Tap any day to play it. Past puzzles don't change your streak, but they count towards your cipher stats.${done?` This month: ${won} of ${done} cracked.`:""}</p>`;
}

/* ---------- key actions ---------- */
function setKey(letter){
  const g=G(),D=g.dec,v=idx(letter);
  if(sel.note!=null){g.notes=g.notes||{};g.notes[sel.note]=letter;return;}
  switch(P.type==="double"?P.inner:P.type){
    case"shift":D.k=v;break;
    case"vig":D.k[sel.slot]=v;break;
    case"scramble":D.k=v;break;
    case"affine":if(sel.slot===1)D.b=v;break;
    case"morse":D.notes[sel.pos]=letter;break;
    case"sub":for(const c in D.map){if(D.map[c]===letter)delete D.map[c];}D.map[sel.letter]=letter;break;
    case"enigma":
      if(sel.crib==null){D.pos[sel.slot]=v;break;}
      if(greensOf(g,P)[sel.crib]){toast("That letter is already confirmed");break;}
      if(P.cipher[sel.crib]===letter){toast("Enigma never turns a letter into itself",2200);break;}
      D.crib[sel.crib]=letter;D.bombe=null;break;
    case"beaufort":case"autokey":D.k[sel.slot]=v;break;
    case"keyword":case"playfair":case"polybius":case"bifid":
      if(sel.kw){if(D.kw.length<12)D.kw+=letter;break;}
      /* window pin for the keyword-square ciphers */
      if(knownOf(g,P)[sel.crib]){toast("That letter is already confirmed");break;}
      if(letter==="J"){toast("I and J share one square: pin I");break;}
      if(P.type==="playfair"&&P.cipher[sel.crib]===letter){toast("Playfair never turns a letter into itself",2200);break;}
      D.crib[sel.crib]=letter;D.bombe=null;break;
    case"running":
      if(sel.kpos!=null)D.key[sel.kpos]=v;
      else D.key[sel.pos]=(idx(P.cipher[sel.pos])-v+26)%26;   /* a message letter fixes the key letter */
      break;
  }
}
function clearKey(){
  const g=G(),D=g.dec;
  if(sel.note!=null){if(g.notes)delete g.notes[sel.note];return;}
  switch(P.type==="double"?P.inner:P.type){
    case"shift":D.k=null;break;
    case"vig":D.k[sel.slot]=null;break;
    case"scramble":D.k=0;break;
    case"affine":if(sel.slot===1)D.b=null;break;
    case"morse":delete D.notes[sel.pos];break;
    case"sub":delete D.map[sel.letter];break;
    case"enigma":if(sel.crib!=null&&D.crib[sel.crib]){delete D.crib[sel.crib];D.bombe=null;}break;
    case"beaufort":case"autokey":D.k[sel.slot]=null;break;
    case"keyword":case"playfair":case"polybius":case"bifid":
      if(sel.kw)D.kw=D.kw.slice(0,-1);
      else if(sel.crib!=null&&D.crib[sel.crib]){delete D.crib[sel.crib];D.bombe=null;}
      break;
    case"running":D.key[sel.kpos!=null?sel.kpos:sel.pos]=null;break;
  }
}
function stepKey(slot,dir){
  const D=G().dec;const cyc=(v,n)=>v==null?(dir>0?0:n-1):(v+dir+n)%n;
  switch(P.type==="double"?P.inner:P.type){
    case"shift":D.k=cyc(D.k,26);break;
    case"vig":D.k[slot]=cyc(D.k[slot],26);break;
    case"scramble":D.k=cyc(D.k||0,26);break;
    case"affine":if(slot===0)D.ai=cyc(D.ai,12);else D.b=cyc(D.b,26);break;
    case"enigma":D.pos[slot]=(D.pos[slot]+dir+26)%26;break;
    case"beaufort":case"autokey":D.k[slot]=cyc(D.k[slot],26);break;
    case"railfence":
      if(slot===0||D.r==null){const rs=[2,3,4];D.r=rs[(rs.indexOf(D.r==null?(dir>0?4:2):D.r)+dir+3)%3];D.o=Math.min(D.o||0,2*D.r-3);}
      else D.o=((D.o||0)+dir+(2*D.r-2))%(2*D.r-2);break;
    case"pigpen":D.t=cyc(D.t,8);break;
  }
  sfx("rotor");buzz("tap");save();renderIntercept();
}
function selectSlot(s){sel=(sel&&JSON.stringify(sel)===JSON.stringify(s))?null:s;renderIntercept();renderKeyboard();}
function onKey(k){
  if(openModal||revealing)return;
  const g=G();if(g.status!=="playing")return;
  if(k!=="ESC")touchGame();
  if(sel){
    /* typing a keyword keeps the box open; every other slot takes one letter */
    if(/^[A-Z]$/.test(k)){sfx("key");buzz("tap");setKey(k);if(!sel.kw)sel=null;save();renderIntercept();renderKeyboard();return;}
    if(k==="BACK"){clearKey();if(!sel.kw)sel=null;save();renderIntercept();renderKeyboard();return;}
    if(k==="LEFT"||k==="RIGHT"){if(sel.slot!=null)stepKey(sel.slot,k==="LEFT"?-1:1);return;}
    if(k==="ENTER"||k==="ESC"){sel=null;renderIntercept();renderKeyboard();}
    return;
  }
  if(/^[A-Z]$/.test(k)){if(g.input.length<5){g.input+=k;sfx("key");buzz("tap");save();renderBoard();}return;}
  if(k==="BACK"){if(g.input.length){g.input=g.input.slice(0,-1);sfx("key");save();renderBoard();}return;}
  if(k==="ENTER")submit();
}
function submit(){
  const g=G(),w=g.input;
  if(w.length<5){toast("Five letters needed");shakeRow();sfx("error");buzz("error");return;}
  if(!VALIDSET.has(w)){toast("Not in the word list");shakeRow();sfx("error");buzz("error");return;}
  g.guesses.push(w);g.input="";sel=null;
  if(P.type==="enigma")g.dec.bombe=null;
  touchGame();
  if(w===P.word)g.status="won";else if(g.guesses.length>=6)g.status="lost";
  if(g.status!=="playing"){pauseTimer();g.score=computeScore(g,P);recordFinish(g);if(state.mode==="daily")scheduleReminders();}
  save();
  revealing=true;justRevealed={row:g.guesses.length-1};render();
  const res=score(w,P.word);res.forEach((r,i)=>setTimeout(()=>sfx("tile",r),reduced?0:i*220+260));
  setTimeout(()=>{
    revealing=false;justRevealed=null;render();
    if(g.status==="won"){toast(PRAISE[g.guesses.length-1]);sfx("win");buzz("win");if(!reduced)document.querySelectorAll(`.row[data-row="${g.guesses.length-1}"] .tile`).forEach(t=>t.classList.add("bounce"));}
    else if(g.status==="lost"){toast(P.word,2600);sfx("lose");buzz("error");}
    if(g.status!=="playing"&&state.mode!=="practice")setTimeout(openStats,1500);
  },reduced?0:4*220+560);
}

function useDecode(){const g=G(),dec=withHints(g,g.hard?[0,1,2,3,4].map(p=>(g.notes&&g.notes[p])||""):decodeWord(P,g.dec));if(!dec.every(Boolean)){toast("Set the key first");return;}g.input=dec.join("");sel=null;save();render();}
function setMode(m){
  if(revealing)return;
  if(m==="weekend"&&!ensureWeekend()){toast("The weekend challenge runs on Saturdays and Sundays");return;}
  if(state.mode===m&&m!=="archive")return;
  pauseTimer();state.mode=m;
  if(m==="practice"&&!state.practice)newPractice();if(m==="daily")ensureToday();
  sel=null;bootLamps=true;refresh();save();render();resumeTimer();maybeWalkthrough();
}
function openArchive(n){
  if(n===todayN()){closeModal();setMode("daily");return;}
  pauseTimer();state.archiveN=n;state.mode="archive";sel=null;bootLamps=true;refresh();save();closeModal();render();resumeTimer();maybeWalkthrough();
}
function practiceType(type,seed,challenge){
  if(revealing)return;pauseTimer();
  if(adDue){adDue=false;showInterstitialNow();}
  newPractice(type);
  if(seed!=null)state.practice.seed=seed;if(challenge)state.practice.challenge=challenge;
  state.mode="practice";sel=null;bootLamps=true;refresh();save();closeModal();render();maybeWalkthrough();
}

/* ---------- guide ---------- */
const GUIDE={
  morse:{how:"Morse code gives every letter a fixed pattern of short (·) and long (–) signals. Here the gaps between letters have been taken out, so the word arrives as one unbroken tape and you have to work out where each letter ends.",
    ex:"SOS → ···–––···",crack:"The same signals can split many ways: ···– could be V, ST, EU or IA. Type letters into the windows and the tape lights up green where they fit, from both ends inwards, and red where they can't. Long, distinctive letters (J ·–––, Q ––·–, Y –·––) are the best footholds.",
    tryLabel:"Run-on Morse",run:w=>ENC.morse(w)},
  shift:{how:"Every letter moves the same number of places along the alphabet, wrapping from Z back to A. Julius Caesar used a shift of 3. The key is one letter: key D means shift 3, because D is 3 places after A.",
    ex:"Key D: HELLO → KHOOR",crack:"There are only 25 keys. Spin the rotor until the windows spell a word. One green tile gives the key away: count from the green letter to the lamp above it.",
    tryLabel:"Key D",run:w=>ENC.shift(w,3)},
  scramble:{how:"Two ciphers stacked, the way real field ciphers such as the German ADFGVX worked: every letter is first shifted by the same amount, then the positions are shuffled with a secret order. It isn't a plain anagram, because the letters themselves are disguised.",
    ex:"Shift C, order 2-5-1-4-3: PLANT → RNCPV → NVRPC",crack:"Turn the shift rotor and watch the small letters under the lamps. When they could spell a word, tap the lamps in that order. Any yellow or green letter narrows the shift to five choices, one for each lamp.",
    tryLabel:"Shift C, order 2-5-1-4-3",run:w=>w.length===5?ENC.scramble(ENC.shift(w,2),[1,4,0,3,2]):"type 5 letters"},
  vig:{how:"A shift cipher with several key letters used in turn. Here the key has two letters: letters 1, 3 and 5 shift by the first, letters 2 and 4 by the second. Published in 1553, it was called the indecipherable cipher for about 300 years.",
    ex:"Key KO: HELLO → RSVZY",crack:"Matching lamps don't always mean matching letters, because they may use different key letters. A green in spot 1, 3 or 5 gives the first key letter; spot 2 or 4 gives the second.",
    tryLabel:"Key KO",run:w=>ENC.vig(w,[10,14])},
  affine:{how:"Number the letters A=0 to Z=25. Multiply by a, add b, and wrap around at 26. The multiplier can't share a factor with 26, so a has 12 possible values and b has 26: 312 keys in all.",
    ex:"Key ×5 +8: HELLO → RCLLA",crack:"Each letter always becomes the same letter, so repeated lamps mean repeated letters. Two greens with different letters are enough to work out both numbers; then turn the rotors to match.",
    tryLabel:"Key ×5 +8",run:w=>ENC.affine(w,5,8)},
  enigma:{how:"The German cipher machine of World War II. Each key press sends current through three rotors, off a reflector and back, lighting a lamp. The rotors turn with every letter, so the same letter encrypts differently each time. This is a working Enigma I (rotors I-II-III, reflector B); the key is the three starting rotor letters, 17,576 options.",
    ex:"Rotors AAA: AAAAA → BDZGO",crack:"Enigma never turns a letter into itself, a flaw Bletchley Park used. Tap a window to pin a letter you suspect (greens pin themselves), then Run bombe: it tests every rotor setting and lists the stops that fit. Two pins usually leave a few dozen stops to read through.",
    tryLabel:"Rotors AAA",run:w=>ENC.enigma(w,[0,0,0])},
  sub:{how:"Every letter is swapped for another using a scrambled alphabet. There are 26! keys, about 4 × 10²⁶. The Keyword cipher is the same idea with an alphabet built from a word.",
    ex:"Keyword ZEBRAS: HELLO → DAIIL",crack:"Repeated lamps mean repeated letters, so study the pattern. Long messages fall to letter counting; with five letters, your colour feedback does most of the work.",
    tryLabel:"ZEBRAS",run:w=>ENC.sub(w,"ZEBRASCDFGHIJKLMNOPQTUVWXY")},
  autokey:{how:"Blaise de Vigenère's own design, from 1586. A two-letter primer starts the key, then the message takes over as its own key: letter 3 is shifted by letter 1, letter 4 by letter 2, and so on. There's no repeating key to spot.",
    ex:"Primer KO: HELLO → "+ENC.autokey("HELLO",[10,14]),crack:"The first primer letter unlocks letters 1, 3 and 5 in a chain; the second unlocks 2 and 4. A wrong letter garbles everything after it in its chain, so a decode that starts well and then falls apart is a near miss. Greens confirm a chain.",
    tryLabel:"Primer KO",run:w=>ENC.autokey(w,[10,14])},
  beaufort:{how:"Like Vigenère, but each letter becomes the key letter minus the message letter. That makes it reciprocal: the same key and the same step both encrypt and decrypt. Here the key has three letters used in turn, so letters 1 and 4 share one, as do 2 and 5. The US Army's M-209 cipher machine worked the same way in World War II.",
    ex:"Key KEY: HELLO → "+ENC.beaufort("HELLO",[10,4,24]),crack:"For a green, add the green letter to the lamp above it (A=0, wrapping at 26) and you have that key letter. Each green also gives you the letter three places along.",
    tryLabel:"Key KEY",run:w=>ENC.beaufort(w,[10,4,24])},
  keyword:{how:"A substitution cipher whose scrambled alphabet starts with a keyword: write the keyword's letters (skipping repeats), then the rest of the alphabet in order. The keyword is another five-letter word, so there are two words to find.",
    ex:"Keyword CRANE: alphabet "+kwAlpha("CRANE")+", so HELLO → "+ENC.keyword("HELLO","CRANE"),crack:"The keyword only rearranges the front of the alphabet, so letters near the end often stay put or move just one or two places. Repeated lamps mean repeated letters. Tap the keyword box, type a guess and watch the windows.",
    tryLabel:"Keyword CRANE",run:w=>ENC.keyword(w,"CRANE")},
  running:{how:"A Vigenère cipher whose key is as long as the message: here another five-letter word. Each letter is shifted by the key letter in the same spot. Spies took running keys from the pages of a book; William Friedman showed in 1918 how to break them, because both texts are ordinary language.",
    ex:"Key word WATER: HELLO → "+ENC.running("HELLO","WATER"),crack:"Type a letter in either row (the small key boxes or the message windows) and the other row fills in. If the key turns into something unlikely, like Q or X, think again. Common letters (E, A, R, T) are good guesses for either word.",
    tryLabel:"Key word WATER",run:w=>w.length===5?ENC.running(w,"WATER"):"type 5 letters"},
  playfair:{how:"Invented by Charles Wheatstone in 1854 and named after Lord Playfair, who promoted it; the British army used it in the Boer War and World War I. Letters are encrypted in pairs using a 5×5 square built from a keyword, with I and J sharing a cell. The word gets an X on the end to make three pairs, so there are six lamps. In a pair: same row, take the letters to the right; same column, the letters below; otherwise, the other two corners of their rectangle.",
    ex:"Keyword CRANE: WA TE RX → "+ENC.playfair("WATERX","CRANE").match(/../g).join(" "),crack:"Playfair never turns a letter into itself, and the sixth lamp must decode to the padding X. Pin letters you know (greens pin themselves), then Test keywords: it tries every common five-letter word as the keyword and lists the ones that fit. Step through them and look for a real word.",
    tryLabel:"Keyword CRANE",tryWord:"WATER",run:w=>w.length!==5?"type 5 letters":!pfOK(w)?"no J or doubled pair":ENC.playfair(w+"X","CRANE")},
  railfence:{how:"One of the oldest transposition ciphers. Write the word in a zigzag across two, three or four rails, then read each rail in turn. Here the zigzag can also start part-way down, so the key is the number of rails plus a starting step.",
    ex:"3 rails, start 1: HELLO → "+ENC.railfence("HELLO",3,0),crack:"The lamps are the right letters in the wrong order, so it's an anagram with only a dozen possible zigzags. Turn the two rotors and watch the windows; greens confirm a setting.",
    tryLabel:"3 rails, start 1",run:w=>ENC.railfence(w,3,0)},
  pigpen:{how:"The Freemasons' cipher from the 1700s: each letter becomes the shape of the grid cell it sits in, with a dot for the second grid. Today's grid has been turned or flipped, so the shapes don't match the usual chart.",
    ex:"Turned 90°: HELLO → "+pigRow(ENC.pigpen("HELLO",1)),crack:"There are only eight ways to turn or flip the grid. E and N sit in the middle of their grids, so they never move. Tap Chart to see the usual shapes, then turn the rotor until the windows read as a word.",
    tryLabel:"Turned 90°",run:w=>pigRow(ENC.pigpen(w,1))},
  polybius:{how:"Described by the Greek historian Polybius about 2,200 years ago: each letter becomes its row and column number in a 5×5 square, with I and J sharing a cell. Here the square starts with a secret five-letter keyword. The same idea became the tap code prisoners used to talk through walls.",
    ex:"Keyword CRANE: HELLO → "+ENC.polybius("HELLO","CRANE").match(/../g).join(" "),crack:"Lamps with the same first number share a row of the square. Pin letters you know by tapping a window (greens pin themselves), then Test keywords lists every common word whose square fits.",
    tryLabel:"Keyword CRANE",run:w=>ENC.polybius(w,"CRANE").match(/../g).join(" ")},
  bifid:{how:"Invented by Félix Delastelle around 1901. Each letter's row and column in a keyword square are written out on two lines, then read across and re-paired into new letters, so every cipher letter depends on two message letters.",
    ex:"Keyword CRANE: HELLO → "+ENC.bifid("HELLO","CRANE"),crack:"A single wrong letter in the key scrambles two letters of the message, so partial decodes are rare. Pin what you know, then Test keywords and read through the squares that fit.",
    tryLabel:"Keyword CRANE",run:w=>ENC.bifid(w,"CRANE")},
  adfgvx:{how:"The German army's cipher of 1918. Each letter becomes two of the letters A D F G V X, chosen because they sound very different in Morse code. The ten signals are written in two rows under five columns, and the columns are sent in a secret order. Here the square is public, so only the column order is secret.",
    ex:"Order 2-5-1-4-3: HELLO → "+ENC.adfgvx("HELLO",[1,4,0,3,2]).match(/../g).join(" "),crack:"Tap the columns in the order you think they were written. Each pair of signals is one letter, and the third letter straddles both rows, so a wrong order shows up quickly as digits or nonsense.",
    tryLabel:"Order 2-5-1-4-3",run:w=>w.length===5?ENC.adfgvx(w,[1,4,0,3,2]).match(/../g).join(" "):"type 5 letters"},
  double:{how:"The weekend challenge: two ciphers stacked. First a Vigenère, Beaufort, Affine or Autokey cipher, then the positions are shuffled. It runs all weekend, alongside the daily puzzle.",
    ex:"Vigenère KO, then order 2-5-1-4-3: HELLO → "+ENC.scramble(ENC.vig("HELLO",[10,14]),[1,4,0,3,2]),crack:"Work in two steps: tap the lamps in the order you think they belong, then set the rotors. Greens tell you both where a letter goes and what the key does there.",
    tryLabel:"Vigenère KO + order 2-5-1-4-3",run:w=>w.length===5?ENC.scramble(ENC.vig(w,[10,14]),[1,4,0,3,2]):"type 5 letters"}
};
function pigRow(w){return `<span class="pgrow">${[...w].map(c=>`<span class="pg">${pigSVG(c)}</span>`).join("")}</span>`;}

const siteURL=p=>isNative()?"/site/"+p.replace(/\/$/,"/index.html"):SITE+"/"+p;
const WEB_SLUG={shift:"shift-cipher",railfence:"rail-fence-cipher",pigpen:"pigpen-cipher",autokey:"autokey-cipher",morse:"morse-code",scramble:"shift-and-scramble",vig:"vigenere-cipher",beaufort:"beaufort-cipher",affine:"affine-cipher",keyword:"keyword-cipher",sub:"substitution-cipher",polybius:"polybius-square",adfgvx:"adfgvx-cipher",running:"running-key-cipher",playfair:"playfair-cipher",bifid:"bifid-cipher",enigma:"enigma-machine"};

  return `<p>One new puzzle every day. Crack the encrypted five-letter word in six guesses. Each day's cipher is a surprise, picked at random from one-star Morse code up to the five-star Enigma machine. With ${GUIDE_ORDER.length} ciphers in the bag, each one turns up once every ${GUIDE_ORDER.length} days, in a random order.</p>

    <p style="margin-top:10px">Under the lamps, the cream windows show your decode. Turn the key rotors (‹ ›) or tap a window and type, and when the windows spell a word, tap <b>Use</b> to drop it into your guess. Green tiles leak the key.</p>

function pigChartHTML(){return [...A].map(c=>`<div><b>${c}</b><span class="pg">${pigSVG(c)}</span></div>`).join("");}
function chartHTML(){return Object.keys(MORSE).map(c=>`<div><b>${c}</b><span>${MORSE[c]}</span></div>`).join("");}
function openGuide(focus){
  $("#guideBody").innerHTML=guideHTML();showModal("guideModal");
