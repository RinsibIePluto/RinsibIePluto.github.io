/* ---------- modals ---------- */
/* In the Android app, the system Back button closes an open sheet: each sheet adds one history entry. */
function isNative(){try{const C=window.Capacitor;return !!(C&&(C.isNativePlatform?C.isNativePlatform():C.platform&&C.platform!=="web"));}catch(e){return false;}}
function hideModal(){if(!openModal)return;if(openModal==="statsModal")hideBanner();$("#"+openModal).hidden=true;openModal=null;if(cdTimer){clearInterval(cdTimer);cdTimer=null;}}
function showModal(id){
  if(openModal)hideModal();
  openModal=id;const m=$("#"+id);m.hidden=false;const c=m.querySelector(".close");if(c)c.focus({preventScroll:true});
}
function closeModal(){
  if(!openModal)return;const was=openModal;hideModal();setTimeout(maybeWalkthrough,300);
  if(was==="statsModal"&&reviewDue){reviewDue=false;setTimeout(askReview,700);}
}

/* ---------- Android Back button: close what's open, step back to the daily, then leave ---------- */
const AppAPI=()=>(window.capacitorApp&&window.capacitorApp.App)||null;
let readerStack=[],readerSkip=false;
function openReader(path){
  const r=$("#reader"),f=$("#readerFrame");readerStack=[];readerSkip=false;
  if(openModal)hideModal();
  f.src="/site/"+path.replace(/\/$/,"/index.html");r.hidden=false;pauseTimer();
}
function closeReader(){const r=$("#reader");if(r.hidden)return;r.hidden=true;$("#readerFrame").src="about:blank";readerStack=[];resumeTimer();}
function readerBack(){
  if(readerStack.length>1){readerStack.pop();readerSkip=true;try{$("#readerFrame").contentWindow.history.back();}catch(e){closeReader();}}
  else closeReader();
}
function readerLoaded(){
  const f=$("#readerFrame");let w,d;try{w=f.contentWindow;d=f.contentDocument;}catch(e){return;}
  if(!w||!d||$("#reader").hidden||!w.location.pathname.startsWith("/site/"))return;
  if(readerSkip)readerSkip=false;else readerStack.push(w.location.href);
  d.addEventListener("click",e=>{
    const a=e.target.closest&&e.target.closest("a[href]");if(!a)return;
    const u=new URL(a.getAttribute("href"),w.location.href);
    if(u.origin!==location.origin){e.preventDefault();location.href=u.href;return;}   /* other websites and email: the phone's own apps */
    if(!u.pathname.startsWith("/site/")){                                             /* Play, or a guide's "Play now": back to the game */
      e.preventDefault();closeReader();const t=u.searchParams.get("practice");if(t&&TYPES[t])practiceType(t);}
  });
}
function onBack(){
  if(!$("#reader").hidden){readerBack();return;}
  if(coachStep>=0&&!$("#coach").hidden){endWalkthrough();return;}
  if(openModal){closeModal();return;}
  if(revealing)return;
  if(sel){onKey("ESC");return;}
  if(state&&state.mode!=="daily"){setMode("daily");return;}
  const a=AppAPI();if(a)a.minimizeApp().catch(()=>{});
}

/* ---------- Play rating prompt: Google's own in-app review sheet, after the 3rd daily win ---------- */
const ReviewAPI=()=>(window.capacitorInAppReview&&window.capacitorInAppReview.InAppReview)||null;
let reviewDue=false;
function maybeQueueReview(){
  const r=settings.review||{n:0,last:-999};
  if(!ReviewAPI()||stats.won<3||r.n>=3||todayN()-r.last<30)return;   /* at most 3 asks, 30+ days apart */
  reviewDue=true;                                                     /* shown when the results are closed */
}
function askReview(){
  const api=ReviewAPI();if(!api)return;
  const r=settings.review||{n:0,last:-999};settings.review={n:r.n+1,last:todayN()};saveSettings();
  api.requestReview().catch(()=>{});
}
const EMO={correct:"🟩",present:"🟨",absent:"⬛"};
function emo(){return settings.cb?{correct:"🟧",present:"🟦",absent:"⬛"}:{correct:"🟩",present:"🟨",absent:"⬛"};}
function resultLine(g){
  const bits=[g.status==="won"?`${fmtPts(g.score)} pts`:"not cracked",fmtTime(g.ms||0)];
  if((g.hints||[]).length)bits.push(`${g.hints.length} hint${g.hints.length>1?"s":""}`);
  if(g.hard)bits.push("hard mode");
  return bits.join(" · ");
}
function shareText(){
  const g=G(),T=TYPES[P.type],sc=g.status==="won"?g.guesses.length:g.status==="lost"?"X":"…",E=emo();
  let head;
  if(state.mode==="daily"||state.mode==="archive")head=`Cyrune No. ${g.n} · ${T.short} ${"★".repeat(T.stars)} ${sc}/6`;
  else if(state.mode==="weekend")head=`Cyrune Weekend No. ${g.no} · ${P.label} ${sc}/6`;
  else head=`Cyrune practice · ${T.short} ${sc}/6`;
  let out=head+"\n"+resultLine(g)+"\n\n"+g.guesses.map(w=>score(w,P.word).map(x=>E[x]).join("")).join("\n");
  if(state.mode==="practice")out+=`\n\nBeat my score: play code ${challengeCode(g)} in Cyrune (Menu → Friend's challenge)`;
  return out;
}
function countdown(){const now=new Date(),t=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);let s=Math.max(0,Math.floor((t-now)/1000));const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");}
function openStats(){
  const g=G(),T=TYPES[P.type],mode=state.mode;
  $("#statsTitle").textContent=mode==="daily"?`No. ${pad3(g.n)} · ${T.short}`:mode==="archive"?`No. ${pad3(g.n)} · ${T.short} (past)`:mode==="weekend"?`Weekend No. ${g.no}`:`Practice · ${T.short}`;
  const chip=g.status==="won"?`<span class="chip won">${g.guesses.length}/6</span>`:g.status==="lost"?`<span class="chip lost">X/6</span>`:`<span class="chip playing">${g.guesses.length?"In progress":"Not started"}</span>`;
  const word=g.status!=="playing"?` <span class="mono" style="color:var(--dim)">${P.word}</span>`:"";
  const n=todayN(),streak=stats.lastWon>=n-1?stats.streak:0,pct=stats.played?Math.round(100*stats.won/stats.played):0,max=Math.max(1,...stats.dist);
  const hi=mode==="daily"&&g.status==="won"?g.guesses.length:0;
  const bars=stats.dist.map((v,i)=>`<div class="dist-row"><span>${i+1}</span><div class="bar${hi===i+1?" hi":""}" style="width:${Math.max(8,Math.round(100*v/max))}%">${v}</div></div>`).join("");
  let vs="";
  if(mode==="practice"&&g.challenge){const f=g.challenge.score;
    vs=g.status==="playing"?`<p class="vs">Your friend scored <b>${fmtPts(f)}</b> on this puzzle. Beat it!</p>`
      :`<p class="vs">Your friend: <b>${fmtPts(f)}</b> · You: <b>${fmtPts(g.score)}</b> · ${g.score>f?"you win!":g.score===f?"a tie.":"they win this one."}</p>`;}
  const rows=GUIDE_ORDER.concat(["double"]).filter(t=>stats.byType[t]&&stats.byType[t].played).map(t=>{const b=stats.byType[t];
    return `<tr><td>${TYPES[t].short}</td><td>${b.played}</td><td>${Math.round(100*b.won/b.played)}%</td><td>${b.won?(b.guesses/b.won).toFixed(1):"–"}</td><td>${b.best?fmtPts(b.best):"–"}</td></tr>`;}).join("");
  const W=stats.weekend;
  $("#statsBody").innerHTML=`
    <ul class="results"><li>${starHTML(T.stars)}<span class="nm">${mode==="weekend"?P.label:T.name}${word}</span>${chip}</li></ul>
    ${g.status!=="playing"?`<p class="rline">${resultLine(g)}</p>`:""}${vs}
    <div class="actions">
      ${g.status!=="playing"?`<button class="btn" data-act="sharecard">Share result</button>`:g.guesses.length?`<button class="btn" data-act="share">Copy progress</button>`:""}
      ${mode==="practice"&&g.status!=="playing"?`<button class="btn alt" data-act="challenge">Challenge a friend</button>`:""}
      ${mode==="practice"?`<button class="btn alt" data-practice="${P.type}">New ${T.short}</button>`:`<button class="btn alt" data-act="gopractice">Practice</button>`}
    </div>
    <div id="fallbackSlot"></div>
    <h3>Daily record</h3>
    <div class="statgrid"><div class="stat"><b>${stats.played}</b><span>Played</span></div><div class="stat"><b>${pct}</b><span>Win %</span></div><div class="stat"><b>${streak}</b><span>Streak</span></div><div class="stat"><b>${stats.best}</b><span>Best streak</span></div></div>
    <div class="statgrid two"><div class="stat"><b>${fmtPts(stats.bestScore)}</b><span>Best score</span></div><div class="stat"><b>${fmtPts(stats.totalScore)}</b><span>Total points</span></div></div>
    <h3>Guesses to crack</h3><div class="dist">${bars}</div>
    ${rows?`<h3>By cipher (every mode)</h3><div class="tblwrap"><table class="bytype"><thead><tr><th>Cipher</th><th>Played</th><th>Won</th><th>Avg</th><th>Best</th></tr></thead><tbody>${rows}</tbody></table></div>`:""}
    ${W.played?`<p class="countdown">Weekend challenges: ${W.won} of ${W.played} cracked · best ${fmtPts(W.best)} pts</p>`:""}
    <p class="countdown">Next daily puzzle in <b id="cd">${countdown()}</b> · cipher unknown</p>`;
  showModal("statsModal");showBanner();
  cdTimer=setInterval(()=>{const el=$("#cd");if(el)el.textContent=countdown();if(ensureToday()){save();if(state.mode==="daily"){refresh();closeModal();bootLamps=true;render();}}},1000);
}

/* ---------- events ---------- */
function bind(){
  document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-site]");
    if(a&&isNative()){e.preventDefault();e.stopPropagation();openReader(a.dataset.site);}},true);
  $("#readerFrame").addEventListener("load",readerLoaded);
  $("#kb").addEventListener("click",e=>{const b=e.target.closest("[data-key]");if(b)onKey(b.dataset.key);});
  $("#strip").addEventListener("click",e=>{
    const gd=e.target.closest("[data-guide]");if(gd){openGuide(gd.dataset.guide);return;}
    const pk=e.target.closest("[data-pick]");if(pk)practiceType(pk.dataset.pick);
    if(e.target.closest("[data-mode=weekend]"))setMode("weekend");
  });
  $("#intercept").addEventListener("click",e=>{
    if(revealing)return;
    const g=G(),D=g.dec,t=P.type;
    const act=e.target.closest("[data-act]");
    if(act){
      const a=act.dataset.act;
      if(a==="use")useDecode();
      else if(a==="hint")useHint();
      else if(a==="chart"){$("#chartTitle").textContent="Morse chart";$("#mchart").className="mchart";$("#mchart").innerHTML=chartHTML();showModal("chartModal");}
      else if(a==="pigchart"){$("#chartTitle").textContent="Pigpen chart";$("#mchart").className="mchart pigs";$("#mchart").innerHTML=pigChartHTML();showModal("chartModal");}
      else if(a==="clear"){
        if(t==="enigma"||KEYWORD_TESTED.includes(t)){D.crib={};D.bombe=null;}
        else if(TAP_TYPES.includes(t))D.slots=[null,null,null,null,null];
        else if(t==="running")D.key=[null,null,null,null,null];
        else D.map={};
        sel=null;save();renderIntercept();renderKeyboard();}
      else if(a==="bombe"){
        const pins=pinsOf(g,P);if(!Object.keys(pins).length){toast("Pin a letter first");return;}
        if(KEYWORD_TESTED.includes(t)){const b=runKeywordBombe(P,pins);D.bombe=b;if(b.stops.length)D.kw=b.stops[0];}
        else{const b=runBombe(P.cipher,pins);D.bombe=b;if(b.stops.length)D.pos=b.stops[0].slice();}
        sel=null;save();renderIntercept();renderKeyboard();
      }else if(a==="next"){if(state.mode==="practice")practiceType(P.type);else openStats();}
      return;
    }
    if(g.status!=="playing")return;
    touchGame();
    const so=e.target.closest("[data-stop]");
    if(so){const b=D.bombe;if(b&&b.stops.length){b.si=(b.si+(+so.dataset.stop)+b.stops.length)%b.stops.length;
      if(KEYWORD_TESTED.includes(t))D.kw=b.stops[b.si];else D.pos=b.stops[b.si].slice();save();renderIntercept();}return;}
    if(e.target.closest("[data-kwin]")){selectSlot({kw:true});return;}
    const kb=e.target.closest("[data-kpos]");if(kb){selectSlot({kpos:+kb.dataset.kpos});return;}
    const st=e.target.closest("[data-step]");if(st){stepKey(+st.dataset.slot,+st.dataset.step);return;}
    const rw=e.target.closest("[data-rwin]");if(rw){selectSlot({slot:+rw.dataset.rwin});return;}
    const lp=e.target.closest("[data-lamp]");
    if(lp){const i=+lp.dataset.lamp;if(D.slots.includes(i))return;const j=D.slots.indexOf(null);if(j<0)return;D.slots[j]=i;sfx("key");buzz("tap");save();renderIntercept();return;}
    const w=e.target.closest("[data-pos]");
    if(w){const p=+w.dataset.pos;
      if(g.hard){if(p<5)selectSlot({note:p});return;}
      switch(t){
        case"double":case"adfgvx":if(D.slots[p]!=null){D.slots[p]=null;save();renderIntercept();}break;
        case"shift":selectSlot({slot:0});break;
        case"vig":selectSlot({slot:p%2});break;
        case"affine":selectSlot({slot:1});break;
        case"sub":selectSlot({letter:P.cipher[p]});break;
        case"morse":selectSlot({pos:p});break;
        case"scramble":if(D.slots[p]!=null){D.slots[p]=null;save();renderIntercept();}break;
        case"enigma":case"playfair":case"polybius":case"bifid":
          if(p>4){toast("The last lamp is padding: it should decode to X");break;}
          if(greensOf(g,P)[p]){toast("That letter is already confirmed");break;}selectSlot({crib:p});break;
        case"beaufort":selectSlot({slot:p%3});break;
        case"autokey":selectSlot({slot:p%2});break;
        case"keyword":selectSlot({kw:true});break;
        case"running":selectSlot({pos:p});break;
      }
    }
  });
  $("#edition").addEventListener("click",e=>{if(e.target.closest("[data-act=install]"))doInstall();});
  $("#coach").addEventListener("click",e=>{const b=e.target.closest("[data-coach]");if(!b)return;
    if(b.dataset.coach==="skip"||coachStep>=wtSteps().length-1)endWalkthrough();else{coachStep++;placeCoach();}});
  window.addEventListener("resize",()=>{if(coachStep>=0)placeCoach();});
  $("#modeDaily").addEventListener("click",()=>setMode("daily"));
  $("#modePractice").addEventListener("click",()=>setMode("practice"));
  $("#menuBtn").addEventListener("click",openMenu);
  $("#statsBtn").addEventListener("click",openStats);
  document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{
    if(e.target===m||e.target.closest("[data-close]")){closeModal();return;}
    const j=e.target.closest("[data-jump]");if(j){e.preventDefault();const el=$("#g-"+j.dataset.jump);if(el)$("#guideSheet").scrollTop=el.offsetTop-8;return;}
    const pr=e.target.closest("[data-practice]");if(pr){practiceType(pr.dataset.practice);return;}
    const st=e.target.closest("[data-set]");if(st){toggleSetting(st.dataset.set);return;}
    const dy=e.target.closest("[data-day]");if(dy){openArchive(+dy.dataset.day);return;}
    const cn=e.target.closest("[data-calnav]");if(cn){const d=new Date(calMonth.y,calMonth.m+(+cn.dataset.calnav),1);calMonth={y:d.getFullYear(),m:d.getMonth()};renderCal();return;}
    const mn=e.target.closest("[data-menu]");if(mn){menuAction(mn.dataset.menu);return;}
    const a=e.target.closest("[data-act]");if(!a)return;
    if(a.dataset.act==="share")copyShare();
    else if(a.dataset.act==="sharecard")shareCard();
    else if(a.dataset.act==="copytext")copyText(shareText());
    else if(a.dataset.act==="challenge")challengeFriend();
    else if(a.dataset.act==="gopractice"){closeModal();setMode("practice");}
    else if(a.dataset.act==="install")doInstall();
  }));
  $("#menuModal").addEventListener("change",e=>{if(e.target.id==="remindTime"){settings.remindTime=e.target.value||"08:00";saveSettings();scheduleReminders();}});
  $("#menuModal").addEventListener("keydown",e=>{if(e.target.id==="codeIn"&&e.key==="Enter"){e.preventDefault();menuAction("code");}});
  $("#guideModal").addEventListener("input",e=>{
    const inp=e.target.closest("[data-try]");if(!inp)return;
    const t=inp.dataset.try,w=inp.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,5);
    inp.value=w;$("#out-"+t).innerHTML=w?GUIDE[t].run(w):"";
  });
  {const app=AppAPI();if(app)app.addListener("backButton",onBack);}
  if(isNative()){document.documentElement.classList.add("native");
    document.querySelectorAll(".sitebar a[data-site]").forEach(a=>a.setAttribute("href",siteURL(a.dataset.site)));}
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")&&e.key!=="Escape")return;
    if(e.key==="Escape"){if(openModal){closeModal();return;}onKey("ESC");return;}
    if(openModal)return;
    let k=null;
    if(e.key==="Enter")k="ENTER";else if(e.key==="Backspace")k="BACK";
    else if(e.key==="ArrowLeft")k="LEFT";else if(e.key==="ArrowRight")k="RIGHT";
    else if(/^[a-zA-Z]$/.test(e.key))k=e.key.toUpperCase();
    if(k){e.preventDefault();onKey(k);}
  });
  document.addEventListener("visibilitychange",()=>{if(document.hidden)pauseTimer();else resumeTimer();if(state)save();});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!revealing&&ensureToday()){save();if(state.mode==="daily"){refresh();bootLamps=true;render();}}});
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderHeader();});
  window.addEventListener("appinstalled",()=>{deferredPrompt=null;renderHeader();toast("Cyrune installed");});
  if(window.ResizeObserver)new ResizeObserver(fit).observe($("#board"));
  window.addEventListener("resize",fit);
}

/* Intro: the rotor spins in, CYRUNE unscrambles letter by letter, then today's cipher appears. Tap skips it. */
function bootScreen(){
  const el=$("#intro");if(!el)return;
  const word="CYRUNE",wEl=$("#bootWord"),sub=$("#bootSub");
  const T=TYPES[P.type];
  sub.innerHTML=state.mode==="daily"?`No. ${pad3(state.daily.n)} · today's cipher<br><b>${T.short}</b> ${"★".repeat(T.stars)}`:`Practice · <b>${T.short}</b>`;
  let done=false,raf=0,last=0;
  const finish=()=>{if(done)return;done=true;cancelAnimationFrame(raf);el.classList.add("gone");setTimeout(()=>{el.remove();maybeWalkthrough();},500);};
  el.addEventListener("click",finish);
  if(reduced){wEl.textContent=word;sub.classList.add("on");setTimeout(finish,700);return;}
  wEl.innerHTML=[...word].map(()=>`<span class="scr">·</span>`).join("");
  const spans=[...wEl.children],t0=performance.now(),lockAt=i=>420+i*130;
  const frame=t=>{
    const e=t-t0,tick=t-last>55;if(tick)last=t;
    spans.forEach((sp,i)=>{
      if(e>=lockAt(i)){if(!sp.classList.contains("lock")){sp.textContent=word[i];sp.className="lock";}}
      else if(tick)sp.textContent=A[Math.floor(Math.random()*26)];
    });
    if(e<lockAt(word.length-1))raf=requestAnimationFrame(frame);else sub.classList.add("on");
  };
  raf=requestAnimationFrame(frame);
  setTimeout(finish,2300);
}
function start(data){
  loadSettings();applySettings();
  const saved=load();const first=!saved&&!(data&&data.state);
  stats=Object.assign(freshStats(),(saved&&saved.stats)||{});
  if(data&&data.state){state=data.state;if(data.stats)stats=data.stats;}
  else state={mode:"daily",daily:saved&&saved.daily||null,practice:saved&&saved.practice||null,arch:saved&&saved.arch||{},weekend:saved&&saved.weekend||null};
  const upgrade=g=>{if(g){g.hints=g.hints||[];g.ms=g.ms||0;g.notes=g.notes||{};if(g.hard==null)g.hard=false;}};
  upgrade(state.daily);upgrade(state.practice);upgrade(state.weekend);Object.values(state.arch||{}).forEach(upgrade);
  if(state.mode==="archive"&&!state.archiveN)state.mode="daily";
  if(state.mode==="weekend"&&!ensureWeekend())state.mode="daily";
  ensureToday();
  if(state.mode==="practice"&&!state.practice)newPractice();
  refresh();
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({state,stats}));
  bind();render();fit();save();
  const link=linkTarget();   /* arriving from a website link: skip the intro and open what was asked for */
  if((data&&data.state)||!settings.intro||link){const b=$("#intro");if(b)b.remove();}else bootScreen();
  if(link){if(link.code)playCode(link.code);else practiceType(link.type);}
  else if(first)openGuide();else setTimeout(maybeWalkthrough,400);
  resumeTimer();scheduleReminders();initAds();
  try{if(!isNative()&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
